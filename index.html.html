:root{
  --color-paper:#fff4e4;--color-card:#fffaf2;--color-ink:#3a2a24;--color-mustard:#e8a317;
  --color-coral:#e07a5f;--color-sage:#5e9a78;--color-mist:#efe4d4;
  --color-m5:#e8a317;--color-m4:#e0b15a;--color-m3:#d7c4a8;--color-m2:#e07a5f;--color-m1:#c4897a;
  --font-sans:"ZCOOL KuaiLe","WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif;
  --radius-film:1.75rem;
}
/* preflight (Tailwind base) */
*,::after,::before{box-sizing:border-box;border:0 solid;margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:var(--font-sans);-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
ul{list-style:none}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button{font:inherit;font-feature-settings:inherit;letter-spacing:inherit;color:inherit;border-radius:0;background-color:transparent;opacity:1}
figure{margin:0}
/* base layer */
html,body{background:var(--color-paper);color:var(--color-ink);min-height:100%}
body{overflow-x:hidden}
button:not(:disabled),[role="button"]:not(:disabled){cursor:pointer}
:focus-visible{outline:2px solid var(--color-ink);outline-offset:3px}

/* utilities used by the original markup */
.mx-auto{margin-left:auto;margin-right:auto}
.flex{display:flex}.inline-flex{display:inline-flex}.grid{display:grid}.block{display:block}
.fixed{position:fixed}.relative{position:relative}.absolute{position:absolute}
.inset-0{inset:0}.inset-x-0{left:0;right:0}.top-0{top:0}.bottom-0{bottom:0}.z-10{z-index:10}.z-20{z-index:20}
.min-h-screen{min-height:100vh}.min-h-24{min-height:6rem}.min-h-14{min-height:3.5rem}
.max-w-5xl{max-width:64rem}.max-w-3xl{max-width:48rem}.max-w-xl{max-width:36rem}.max-w-lg{max-width:32rem}.max-h-full{max-height:100%}
.h-1{height:.25rem}.h-3{height:.75rem}.h-4{height:1rem}.h-11{height:2.75rem}.h-12{height:3rem}.h-14{height:3.5rem}.h-80{height:20rem}.h-full{height:100%}
.w-3{width:.75rem}.w-4{width:1rem}.w-6{width:1.5rem}.w-8{width:2rem}.w-12{width:3rem}.w-auto{width:auto}.w-full{width:100%}
.flex-1{flex:1}.shrink-0{flex-shrink:0}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.items-end{align-items:flex-end}.self-stretch{align-self:stretch}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.place-items-center{place-items:center}
.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-6{gap:1.5rem}
.p-4{padding:1rem}.p-6{padding:1.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}
.px-5{padding-left:1.25rem;padding-right:1.25rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-4{padding-top:1rem;padding-bottom:1rem}.py-8{padding-top:2rem;padding-bottom:2rem}
.mb-3{margin-bottom:.75rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-5{margin-top:1.25rem}.mt-6{margin-top:1.5rem}
.overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}.pointer-events-none{pointer-events:none}
.rounded-full{border-radius:9999px}.rounded-2xl{border-radius:1rem}.rounded-3xl{border-radius:1.5rem}
.aspect-video{aspect-ratio:16/9}.aspect-square{aspect-ratio:1/1}
.object-cover{object-fit:cover}.object-contain{object-fit:contain}
.text-left{text-align:left}
.bg-mustard{background-color:var(--color-mustard)}.bg-card{background-color:var(--color-card)}.bg-mist{background-color:var(--color-mist)}
.bg-paper{background-color:var(--color-paper)}.bg-coral{background-color:var(--color-coral)}
.bg-m5{background-color:var(--color-m5)}.bg-m4{background-color:var(--color-m4)}.bg-m3{background-color:var(--color-m3)}.bg-m2{background-color:var(--color-m2)}.bg-m1{background-color:var(--color-m1)}
.bg-ink\/40{background-color:color-mix(in oklab,var(--color-ink) 40%,transparent)}
.text-ink{color:var(--color-ink)}.text-coral{color:var(--color-coral)}
.fill-coral{fill:var(--color-coral)}
.shadow-lg{box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1)}
.ring-2{box-shadow:0 0 0 2px var(--color-ink)}
.text-sm{font-size:.875rem;line-height:var(--tw-leading,1.4286)}
.text-base{font-size:1rem;line-height:var(--tw-leading,1.5)}
.text-lg{font-size:1.125rem;line-height:var(--tw-leading,1.5556)}
.text-xl{font-size:1.25rem;line-height:var(--tw-leading,1.4)}
.text-2xl{font-size:1.5rem;line-height:var(--tw-leading,1.3333)}
.text-4xl{font-size:2.25rem;line-height:var(--tw-leading,1.1111)}
.leading-tight{--tw-leading:1.25;line-height:1.25}
.leading-relaxed{--tw-leading:1.625;line-height:1.625}
@media (width>=40rem){.sm\:aspect-video{aspect-ratio:16/9}.sm\:items-center{align-items:center}}
@media (width>=48rem){.md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.md\:text-5xl{font-size:3rem;line-height:var(--tw-leading,1)}.md\:h-96{height:24rem}}

@keyframes drift{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes drift-tight{from{transform:scale(1.2)}to{transform:scale(1.3)}}
@keyframes cue-in{from{opacity:0;transform:translateY(.35rem)}to{opacity:1;transform:none}}
@keyframes breath{0%{transform:scale(.72);opacity:.55}100%{transform:scale(1.2);opacity:0}}
@keyframes mote{from{transform:translateY(.4rem);opacity:.25}to{transform:translateY(-.8rem);opacity:.6}}
.shot-drift{animation:drift 18s ease-out forwards;transform-origin:center center}
.shot-tight{animation-name:drift-tight;transform-origin:62% 42%}
.cue-in{animation:cue-in 220ms ease-out}
.breath-ring{animation:breath 3.4s ease-out infinite}
.breath-ring.delay{animation-delay:1.1s}
.mote{position:absolute;border-radius:999px;background:color-mix(in srgb,white 75%,var(--color-mist));opacity:.4;animation:mote 6.5s ease-in-out infinite alternate}
.mote:nth-child(1){width:.55rem;height:.55rem;left:14%;top:22%}
.mote:nth-child(2){width:.4rem;height:.4rem;left:28%;top:12%;animation-delay:.8s}
.mote:nth-child(3){width:.7rem;height:.7rem;left:48%;top:18%;animation-delay:1.4s}
.mote:nth-child(4){width:.35rem;height:.35rem;right:18%;top:28%;animation-delay:.4s}
.room{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--color-mustard) 28%,transparent),transparent 42%),var(--color-paper)}
.room-window{position:absolute;left:6%;top:8%;width:34%;height:46%;border-radius:1.25rem;padding:.55rem;background:color-mix(in srgb,var(--color-ink) 18%,var(--color-card))}
.room-sky{position:relative;height:100%;width:100%;overflow:hidden;border-radius:.8rem}
.room-window.is-haze .room-sky{background:linear-gradient(180deg,color-mix(in srgb,var(--color-ink) 35%,var(--color-mist)),var(--color-mist))}
.room-window.is-soft .room-sky{background:linear-gradient(180deg,var(--color-card),var(--color-mist))}
.room-window.is-warm .room-sky{background:radial-gradient(circle at 30% 28%,var(--color-mustard),var(--color-sage) 46%,var(--color-mist) 78%)}
.room-sun{position:absolute;top:14%;left:12%;width:32%;aspect-ratio:1;border-radius:999px;background:var(--color-card)}
.room-screen{position:absolute;left:5%;top:22%;width:42%;height:62%;border-radius:1.1rem;background:var(--color-card);box-shadow:0 10px 24px color-mix(in srgb,var(--color-ink) 12%,transparent)}
.room-teacher{position:absolute;left:4%;bottom:0;height:92%;width:44%}
.room-teacher,.room-lele{z-index:2}
.room-teacher img,.room-lele img{height:100%;width:100%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 10px 8px color-mix(in srgb,var(--color-ink) 16%,transparent))}
.room-lele{position:absolute;bottom:0;height:96%;width:46%}
.room-lele.is-right{right:0}
.room-lele.is-left{left:0}
.room-lele.is-center{left:50%;width:52%;transform:translateX(-50%)}
.room-lele.is-small{right:0;width:34%;height:72%}
.room-lele img{object-position:bottom center}
.room-desk{position:absolute;left:8%;right:8%;bottom:0;height:13%;border-radius:1.1rem 1.1rem 0 0;background:color-mix(in srgb,var(--color-mustard) 72%,var(--color-ink));z-index:3}
.room-laptop{position:absolute;right:16%;bottom:14%;width:18%;height:14%;border-radius:.35rem .35rem 0 0;background:var(--color-ink);z-index:2}
.room-laptop span{position:absolute;left:8%;right:8%;top:8%;bottom:22%;border-radius:.15rem;background:var(--color-card)}
.room-cards{position:absolute;top:4%;left:4%;right:4%;z-index:3;display:flex;justify-content:space-between;gap:.35rem}
.room.has-cards .room-teacher,.room.has-cards .room-lele{height:calc(100% - 4.6rem)}
.room-card{display:flex;width:auto;flex-direction:column;align-items:center;gap:.2rem}
.room-card img{width:2.75rem;height:2.75rem;border-radius:999px;object-fit:cover;background:var(--color-card);box-shadow:0 4px 0 color-mix(in srgb,var(--color-ink) 12%,transparent)}
.room-card.is-on img{box-shadow:0 0 0 4px var(--color-mustard)}
.room-card.is-off{opacity:.55}
.room-card span{font-size:.72rem;line-height:1.2;text-align:center}
.room-face{position:absolute;left:50%;top:42%;width:min(40%,15rem);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:999px;object-fit:cover;background:var(--color-card);box-shadow:0 16px 32px color-mix(in srgb,var(--color-ink) 16%,transparent)}
.room-paper{position:absolute;left:18%;bottom:16%;z-index:4;width:22%;height:18%;border-radius:.35rem;background:var(--color-card);box-shadow:0 6px 0 color-mix(in srgb,var(--color-ink) 10%,transparent)}
.room-dot{position:absolute;border-radius:999px}
.room-dot.a{left:18%;top:26%;width:.9rem;height:.9rem;background:var(--color-coral)}
.room-dot.b{left:50%;top:40%;width:.7rem;height:.7rem;background:var(--color-mustard)}
.room-dot.c{left:30%;top:58%;width:1.15rem;height:.55rem;background:var(--color-sage)}
.room-cup{position:absolute;left:42%;bottom:15%;z-index:4;width:7%;height:12%;border-radius:0 0 .5rem .5rem;background:color-mix(in srgb,var(--color-sage) 55%,white);box-shadow:inset 0 .4rem 0 color-mix(in srgb,white 55%,transparent)}
.breath-ring{position:absolute;left:50%;top:38%;width:28%;aspect-ratio:1;border-radius:999px;border:3px solid var(--color-sage);transform:translate(-50%,-50%)}
.banner-chip{position:absolute;left:4%;bottom:6%;z-index:4;max-width:92%;border-radius:999px;background:var(--color-card);padding:.45rem .9rem;font-size:1.05rem;line-height:1.35;box-shadow:0 8px 18px color-mix(in srgb,var(--color-ink) 12%,transparent)}
.slot{display:contents}
@media (prefers-reduced-motion:reduce){.shot-drift,.shot-tight,.cue-in,.breath-ring,.mote{animation:none}}
</style>

    var value=0;
    if(/zh-CN|zh_CN/i.test(v.lang)) value+=5;
    if(/ting|yao|xiao|hui|female|女/i.test(v.name)) value+=3;
    return value;
  }
  return zh.sort(function(a,b){return score(b)-score(a);})[0] || null;
}
function sceneFor(play){
  if((play.phase==="reply"||play.phase==="end") && play.mood) return replyScene(play.mood);
  return SCENES[play.sceneIndex] || SCENES[0];
}

var phase="title", sceneIndex=0, lineIndex=0, paused=false, mood=null, quiet=false, voiceReady=null, notes=false;
var playRef={phase:"title",sceneIndex:0,lineIndex:0,paused:false,mood:null,token:0};
var voiceRef=null, quietRef=false, timerRef=null, watchRef=null, utterRef=null;

var renderQueued=false;
function render_(){ if(renderQueued) return; renderQueued=true; queueMicrotask(function(){ renderQueued=false; render(); }); }
function setPhase(v){phase=v;render_();}
function setSceneIndex(v){sceneIndex=v;render_();}
function setLineIndex(v){lineIndex=v;render_();}
function setPaused(v){paused=v;render_();}
function setMood(v){mood=v;render_();}
function setQuiet(v){quiet=v;render_();}
function setVoiceReady(v){voiceReady=v;render_();}
function setNotes(v){notes=v;render_();}

function clearTimers(){
  if(timerRef) window.clearTimeout(timerRef);
  if(watchRef) window.clearTimeout(watchRef);
  timerRef=null; watchRef=null;
}
function sync(next){
  for(var k in next) playRef[k]=next[k];
  if(next.phase) setPhase(next.phase);
  if(next.sceneIndex!==undefined) setSceneIndex(next.sceneIndex);
  if(next.lineIndex!==undefined) setLineIndex(next.lineIndex);
  if(next.paused!==undefined) setPaused(next.paused);
  if(next.mood!==undefined) setMood(next.mood);
}
function finishLine(my){
  var play=playRef;
  if(play.token!==my||play.paused) return;
  play.token+=1;
  clearTimers();
  var scene=sceneFor(play);
  var nextLine=play.lineIndex+1;
  if(nextLine<scene.lines.length){
    play.lineIndex=nextLine; setLineIndex(nextLine); speakCurrent(); return;
  }
  if(play.phase==="reply"){ sync({phase:"end",paused:false}); return; }
  if(play.sceneIndex>=SCENES.length-1){ sync({phase:"choose",paused:false}); return; }
  play.sceneIndex+=1; play.lineIndex=0;
  setSceneIndex(play.sceneIndex); setLineIndex(0);
  speakCurrent();
}
function speakCurrent(){
  var play=playRef;
  if(play.paused) return;
  if(play.phase!=="play"&&play.phase!=="reply") return;
  var scene=sceneFor(play);
  var line=scene.lines[play.lineIndex];
  if(!line) return;
  var my=++play.token;
  setLineIndex(play.lineIndex);
  var settled=false;
  function done(){ if(settled) return; settled=true; finishLine(my); }
  var text=line.text;
  var synth=typeof window==="undefined"?undefined:window.speechSynthesis;
  var voice=voiceRef;
  var useVoice=Boolean(synth && !quietRef && voice);
  if(!useVoice||!synth||!voice){
    var ms=Math.min(7200,Math.max(1700,text.length*270));
    timerRef=window.setTimeout(done,ms);
    return;
  }
  var utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=voice.lang||"zh-CN";
  utterance.voice=voice;
  utterance.rate=0.88;
  utterRef=utterance;
  utterance.onend=done;
  utterance.onerror=function(event){
    if(event.error==="interrupted"||event.error==="canceled") return;
    done();
  };
  var cap=Math.min(14000,Math.max(2800,text.length*480+1200));
  watchRef=window.setTimeout(done,cap);
  window.setTimeout(function(){
    if(settled||playRef.token!==my) return;
    if(!synth.speaking&&!synth.pending){
      var ms2=Math.min(7200,Math.max(1500,text.length*250));
      timerRef=window.setTimeout(done,ms2);
    }
  },280);
  synth.speak(utterance);
}
function armVoice(){
  var synth=window.speechSynthesis;
  if(!synth){ voiceRef=null; setVoiceReady(false); return; }
  var found=pickVoice(synth.getVoices());
  voiceRef=found;
  setVoiceReady(Boolean(found));
  if(!found){
    var onVoices=function(){
      var voice=pickVoice(synth.getVoices());
      if(!voice) return;
      voiceRef=voice;
      setVoiceReady(true);
      var play=playRef;
      if(play.phase==="play"&&play.sceneIndex===0&&play.lineIndex===0&&!play.paused&&!quietRef){
        synth.cancel(); clearTimers(); speakCurrent();
      }
    };
    synth.addEventListener("voiceschanged",onVoices,{once:true});
  }
}
function cancelSpeech(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }
function start(){
  cancelSpeech(); clearTimers(); armVoice();
  quietRef=quiet;
  sync({phase:"play",sceneIndex:0,lineIndex:0,paused:false,mood:null,token:playRef.token+1});
  speakCurrent();
}
function goTo(index){
  var next=Math.max(0,Math.min(SCENES.length-1,index));
  cancelSpeech(); clearTimers();
  sync({phase:"play",sceneIndex:next,lineIndex:0,paused:false,token:playRef.token+1});
  speakCurrent();
}
function togglePause(){
  var play=playRef;
  if(play.phase==="title"){ start(); return; }
  if(play.phase==="choose"||play.phase==="end"){ goTo(SCENES.length-1); return; }
  cancelSpeech(); clearTimers();
  if(play.paused){ sync({paused:false}); speakCurrent(); return; }
  sync({paused:true,token:play.token+1});
}
function toggleQuiet(){
  var next=!quietRef;
  quietRef=next; setQuiet(next);
  var play=playRef;
  if((play.phase==="play"||play.phase==="reply")&&!play.paused){
    cancelSpeech(); clearTimers(); speakCurrent();
  }
}
function choose(id){
  cancelSpeech(); clearTimers();
  sync({phase:"reply",mood:id,lineIndex:0,paused:false,token:playRef.token+1});
  speakCurrent();
}
window.setInterval(function(){
  var play=playRef;
  if(!quietRef&&!play.paused&&(play.phase==="play"||play.phase==="reply")){
    if(window.speechSynthesis) window.speechSynthesis.resume();
  }
},4000);
window.addEventListener("keydown",function(e){ if(notes&&e.key==="Escape") setNotes(false); });

/* ---------- rendering ---------- */
var app=document.getElementById("app");
var mode=null, cache={};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function slot(id, html){
  var el=document.getElementById(id);
  if(!el||cache[id]===html) return;
  var ae=document.activeElement, fk=ae&&ae.closest&&el.contains(ae)?ae.getAttribute("data-k"):null;
  el.innerHTML=html; cache[id]=html;
  if(fk){ var again=el.querySelector('[data-k="'+fk+'"]'); if(again) again.focus(); }
}
function ensureMode(m, html){
  if(mode===m) return;
  mode=m; cache={}; app.innerHTML=html;
}
function teacherNotes(){
  var items=SCENES.map(function(scene){
    return '<li><p class="text-lg">'+esc(scene.title)+'</p><p class="text-base leading-relaxed">'+esc(scene.teacher)+'</p></li>';
  }).join("");
  return '<div class="fixed inset-0 z-20 flex items-end justify-center bg-ink/40 p-4 sm:items-center" role="dialog" aria-modal="true" aria-labelledby="teacher-title">'+
    '<div class="max-h-full w-full max-w-lg overflow-y-auto rounded-3xl bg-card p-6 text-ink">'+
    '<h2 id="teacher-title" class="text-2xl">给老师的话</h2>'+
    '<p class="mt-3 text-base leading-relaxed">适合小学一、二年级。约两分钟。最后一幕可以停下来，邀请孩子点一点，或告诉老师、爸爸妈妈。</p>'+
    '<ul class="mt-4 flex flex-col gap-3">'+items+'</ul>'+
    '<p class="mt-4 text-base leading-relaxed">深呼吸、说出来、做一件舒服的小事，都只是可以试的方法。如果孩子还是很难过，请留下来陪他，并一起找信任的大人。</p>'+
    '<button type="button" class="mt-5 h-12 rounded-full bg-mustard px-5 text-lg text-ink" data-act="close-notes">知道了</button>'+
    '</div></div>';
}
function roomHtml(shot, active){
  var showWindow=!shot.teacher&&!shot.cards&&!shot.bigFace&&!shot.breath;
  var face=active?moodById(active).image:null;
  var h='<div class="'+(shot.cards?"room has-cards":"room")+'">';
  if(showWindow) h+='<div class="room-window is-'+shot.weather+'"><div class="room-sky">'+(shot.weather==="warm"?'<span class="room-sun"></span>':'')+'</div></div>';
  if(shot.breath) h+='<span class="breath-ring"></span><span class="breath-ring delay"></span>';
  if(shot.teacher) h+='<div class="room-screen"></div><div class="room-teacher"><img src="'+IMG.teacher+'" alt=""></div>';
  if(shot.bigFace&&face) h+='<img src="'+face+'" alt="" class="room-face">';
  if(shot.cards){
    h+='<div class="room-cards">';
    MOODS.forEach(function(item){
      var on=shot.celebrate||active===item.id;
      var dim=!shot.celebrate&&active!=null&&active!==item.id;
      h+='<div class="'+(dim?"room-card is-off":(on&&active===item.id?"room-card is-on":"room-card"))+'"><img src="'+item.image+'" alt=""></div>';
    });
    h+='</div>';
  }
  if(shot.lele!=="hide") h+='<div class="room-lele is-'+shot.lele+'"><img src="'+IMG.lele+'" alt=""></div>';
  if(shot.desk) h+='<div class="room-desk"></div>';
  if(shot.laptop) h+='<div class="room-laptop"><span></span></div>';
  if(shot.paper) h+='<div class="room-paper"><i class="room-dot a"></i><i class="room-dot b"></i><i class="room-dot c"></i></div>';
  if(shot.paper) h+='<div class="room-cup"></div>';
  return h+'</div>';
}
var TONE={5:"bg-m5",4:"bg-m4",3:"bg-m3",2:"bg-m2",1:"bg-m1"};
function pickerHtml(selected, waiting){
  var fill=selected?selected*20:12;
  var btns=MOODS.map(function(item){
    var pressed=selected===item.id;
    return '<button type="button" data-k="mood'+item.id+'" data-act="choose" data-id="'+item.id+'" aria-pressed="'+pressed+'" class="'+
      (pressed?"flex min-h-14 items-center gap-3 rounded-2xl bg-mist px-3 py-2 text-left ring-2 ring-ink":"flex min-h-14 items-center gap-3 rounded-2xl bg-paper px-3 py-2 text-left")+'">'+
      '<span class="h-4 w-4 shrink-0 rounded-full '+TONE[item.id]+'"></span>'+
      '<img src="'+item.image+'" alt="" class="h-12 w-12 shrink-0 rounded-full object-cover">'+
      '<span><span class="block text-lg text-ink">'+esc(item.name)+'</span><span class="block text-base text-ink">'+esc(item.line)+'</span></span></button>';
  }).join("");
  return '<section class="mt-2 rounded-3xl bg-card p-4" aria-label="心情温度计">'+
    '<h2 class="text-xl text-ink">今天，你的心情是几度？</h2>'+
    '<p class="mt-1 text-base leading-relaxed text-ink">数字只是用来表达，不是排名。每种心情都没有对错。</p>'+
    '<div class="mt-3 flex gap-3"><div class="relative w-4 self-stretch rounded-full bg-mist" aria-hidden="true"><div class="absolute inset-x-0 bottom-0 rounded-full bg-coral" style="height:'+fill+'%"></div></div>'+
    '<div class="flex flex-1 flex-col gap-2">'+btns+'</div></div>'+
    (waiting?'<p class="cue-in mt-3 text-lg text-ink">点一个最像今天的表情。</p>':'')+'</section>';
}

var TITLE_HTML=
  '<main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-center px-5 py-8">'+
  '<div class="grid items-center gap-6 md:grid-cols-2"><div>'+
  '<p class="text-base text-coral">小学一、二年级 · 约两分钟</p>'+
  '<h1 class="mt-2 text-4xl leading-tight text-ink md:text-5xl">今天，你的心情是几度？</h1>'+
  '<p class="mt-4 max-w-xl text-lg leading-relaxed text-ink">烟霾那些天，乐乐在家上网课。他有点闷，有点想朋友。后来，他认识了一支心情温度计。</p>'+
  '<div class="mt-6 flex flex-wrap gap-3">'+
  '<button type="button" class="inline-flex h-14 items-center gap-2 rounded-full bg-mustard px-6 text-lg text-ink" data-act="start">'+ic("Play")+'开始看故事</button>'+
  '<button type="button" class="inline-flex h-14 items-center gap-2 rounded-full bg-card px-5 text-lg text-ink" data-act="open-notes">'+ic("BookOpen")+'给老师的话</button>'+
  '</div><p class="mt-6 text-base text-ink">每一种心情，都值得被温柔对待。</p></div>'+
  '<img src="'+IMG.lele+'" alt="乐乐，穿着黄色连帽衫的小男孩" class="mx-auto h-80 w-auto object-contain md:h-96"></div>'+
  '<div class="slot" id="r-notes"></div></main>';

var PLAY_HTML=
  '<main class="mx-auto min-h-screen max-w-3xl px-4 py-4">'+
  '<header class="mb-3 flex items-end justify-between gap-3" id="r-head"></header>'+
  '<figure id="r-fig"><div class="absolute inset-x-0 top-0 z-10 h-1 bg-mist"><div class="h-full bg-mustard" id="r-bar"></div></div>'+
  '<div class="slot" id="r-media"></div><div class="slot" id="r-motes"></div><div class="slot" id="r-banner"></div></figure>'+
  '<div class="slot" id="r-caption"></div><div class="slot" id="r-picker"></div><div class="slot" id="r-endmsg"></div>'+
  '<div class="mt-4 flex flex-wrap items-center gap-2" id="r-controls"></div>'+
  '<div class="slot" id="r-voice"></div><div class="slot" id="r-endbtn"></div><div class="slot" id="r-notes"></div></main>';

function render(){
  if(phase==="title"){
    ensureMode("title",TITLE_HTML);
    slot("r-notes", notes?teacherNotes():"");
    return;
  }
  ensureMode("play",PLAY_HTML);
  var visual=sceneFor({phase:phase,sceneIndex:sceneIndex,lineIndex:lineIndex,paused:paused,mood:mood,token:0});
  var line=visual.lines[Math.min(lineIndex,Math.max(visual.lines.length-1,0))];
  var shot=visual.shots[(line&&line.shot)||0]||visual.shots[0];
  var caption=phase==="choose"?"今天，你的心情是几度？点一个最像今天的你。":phase==="end"?"每一种心情，都值得被温柔对待。":((line&&line.text)||"");
  var banner=phase==="choose"?"今天，你的心情是几度？":phase==="end"?moodById(mood||1).name:(line&&line.banner);
  var activeMood=(phase==="reply"||phase==="end")?mood:((line&&line.mood)||null);
  var showPicker=phase==="choose"||phase==="reply"||phase==="end"||(phase==="play"&&visual.id==="s7");
  var dotIndex=(phase==="choose"||phase==="reply"||phase==="end")?SCENES.length-1:sceneIndex;

  slot("r-head",'<div><p class="text-sm text-coral">心情温度计</p><h1 class="text-2xl leading-tight text-ink">'+esc(visual.title)+'</h1></div>'+
    '<p class="shrink-0 text-base text-ink">第 '+(dotIndex+1)+' 幕<span class="text-ink"> / '+SCENES.length+'</span></p>');

  var fig=document.getElementById("r-fig");
  var figCls=shot.kind==="photo"?"relative aspect-video overflow-hidden rounded-3xl bg-mist shadow-lg":"relative aspect-square overflow-hidden rounded-3xl bg-mist shadow-lg sm:aspect-video";
  if(fig.className!==figCls) fig.className=figCls;
  document.getElementById("r-bar").style.width=(((Math.min(lineIndex,visual.lines.length-1)+1)/visual.lines.length)*100)+"%";

  if(shot.kind==="photo"){
    var mkey="photo:"+shot.key+"-"+(shot.crop||"wide");
    if(cache["r-media-key"]!==mkey){
      document.getElementById("r-media").innerHTML='<img src="'+shot.src+'" alt="" class="'+(shot.crop==="tight"?"shot-drift shot-tight h-full w-full object-cover":"shot-drift h-full w-full object-cover")+'">';
      cache["r-media-key"]=mkey; cache["r-media"]=null;
    }
    document.getElementById("r-media").firstChild.setAttribute("alt",shot.alt);
  } else {
    var rh=roomHtml(shot,activeMood);
    var rkey="room:"+rh;
    if(cache["r-media-key"]!==rkey){
      document.getElementById("r-media").innerHTML=rh; cache["r-media-key"]=rkey; cache["r-media"]=null;
    }
  }
  slot("r-motes",((visual.id==="s1"||visual.id==="s2")&&shot.kind==="photo")?'<div class="pointer-events-none absolute inset-0"><span class="mote"></span><span class="mote"></span><span class="mote"></span><span class="mote"></span></div>':"");
  slot("r-banner",banner?'<figcaption class="banner-chip">'+esc(banner)+'</figcaption>':"");

  slot("r-caption",'<p class="cue-in mt-4 min-h-24 text-2xl leading-relaxed text-ink" aria-live="polite">'+esc(caption)+'</p>');
  slot("r-picker",showPicker?pickerHtml(mood,phase==="choose"):"");
  slot("r-endmsg",(phase==="end"&&mood)?'<p class="mt-4 flex items-center gap-2 text-lg text-ink">'+ic("Heart","fill-coral text-coral")+'你今天的心情是「'+esc(moodById(mood).name)+'」。没有对错。</p>':"");

  var playIcon=paused||phase==="choose"||phase==="end";
  var dots=SCENES.map(function(scene,index){
    return '<button type="button" class="grid h-11 w-8 place-items-center" data-k="dot'+index+'" data-act="go" data-id="'+index+'" aria-label="'+esc(scene.title)+'"'+(index===dotIndex?' aria-current="step"':'')+'>'+
      '<span class="'+(index===dotIndex?"h-3 w-6 rounded-full bg-mustard":"h-3 w-3 rounded-full bg-m3")+'"></span></button>';
  }).join("");
  slot("r-controls",
    '<button type="button" data-k="pause" data-act="toggle" class="grid h-12 w-12 place-items-center rounded-full bg-mustard text-ink" aria-label="'+(playIcon?"播放":"暂停")+'">'+ic(playIcon?"Play":"Pause")+'</button>'+
    '<button type="button" data-k="prev" data-act="prev" class="grid h-12 w-12 place-items-center rounded-full bg-card text-ink" aria-label="上一幕">'+ic("ChevronLeft")+'</button>'+
    '<div class="flex items-center">'+dots+'</div>'+
    '<button type="button" data-k="next" data-act="next" class="grid h-12 w-12 place-items-center rounded-full bg-card text-ink" aria-label="下一幕">'+ic("ChevronRight")+'</button>'+
    '<button type="button" data-k="quiet" data-act="quiet" class="inline-flex h-12 items-center gap-2 rounded-full bg-card px-4 text-base text-ink">'+ic(quiet?"VolumeX":"Volume2")+(quiet?"听故事":"安静看")+'</button>'+
    '<button type="button" data-k="again" data-act="start" class="inline-flex h-12 items-center gap-2 rounded-full bg-card px-4 text-base text-ink">'+ic("RotateCcw")+'再看一次</button>'+
    '<button type="button" data-k="notes" data-act="open-notes" class="grid h-12 w-12 place-items-center rounded-full bg-card text-ink" aria-label="给老师的话">'+ic("BookOpen")+'</button>');
  slot("r-voice",voiceReady===false?'<p class="mt-3 text-base leading-relaxed text-ink">这台设备没有中文朗读，故事会按字幕播放。老师也可以跟着读。</p>':"");
  slot("r-endbtn",phase==="end"?'<div class="mt-4 flex flex-wrap gap-3"><button type="button" class="h-12 rounded-full bg-mustard px-5 text-lg text-ink" data-act="again-choose">再选一次</button></div>':"");
  slot("r-notes",notes?teacherNotes():"");
}

document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("[data-act]");
  if(!t) return;
  var act=t.getAttribute("data-act"), id=Number(t.getAttribute("data-id"));
  var dotIndex=(phase==="choose"||phase==="reply"||phase==="end")?SCENES.length-1:sceneIndex;
  if(act==="start") start();
  else if(act==="open-notes") setNotes(true);
  else if(act==="close-notes") setNotes(false);
  else if(act==="toggle") togglePause();
  else if(act==="prev") goTo(dotIndex-1);
  else if(act==="next") goTo(dotIndex+1);
  else if(act==="go") goTo(id);
  else if(act==="quiet") toggleQuiet();
  else if(act==="choose") choose(id);
  else if(act==="again-choose") goTo(SCENES.length-1);
});
render();
</script>
